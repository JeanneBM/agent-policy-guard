[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-policy-guard"
version = "0.1.0"
description = "Deterministic authorization for proposed AI agent actions"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
