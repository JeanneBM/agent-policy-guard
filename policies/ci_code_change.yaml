id: ci-repair
version: "0.1.0"
rules:
  - id: protected-path
    decision: deny
    reason: Workflow changes are forbidden
    conditions:
      - {field: action.type, op: eq, value: ci.propose_patch}
      - {field: context.facts.touches_workflow, op: eq, value: true}
  - id: verified-test-patch
    decision: allow
    reason: Host-verified test-only patch may be proposed for review
    conditions:
      - {field: action.type, op: eq, value: ci.propose_patch}
      - {field: action.target, op: eq, value: "example/ci-lab"}
      - {field: context.actor, op: eq, value: ci-repair-agent}
      - {field: context.environment, op: eq, value: lab}
      - {field: context.facts.patch_verified, op: eq, value: true}
      - {field: context.facts.touches_workflow, op: eq, value: false}
      - {field: context.facts.tests_passed, op: eq, value: true}
